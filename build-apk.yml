name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak release.zip bila ada
        run: |
          if [ -f release.zip ]; then
            unzip -o release.zip
            rm -f release.zip
            if [ -f HAPUS.txt ]; then
              while IFS= read -r f; do
                case "$f" in ""|/*|*..*|.git*|.github*) continue;; esac
                rm -rf -- "$f"
              done < HAPUS.txt
              rm -f HAPUS.txt
            fi
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Ekstrak release.zip" || true
            git push || true
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang paket
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Ikon dan splash
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#4564e8' --iconBackgroundColorDark '#4564e8' \
            --splashBackgroundColor '#090d18' --splashBackgroundColorDark '#090d18'

      - name: Tema splash gelap (Android 12+)
        run: |
          S=android/app/src/main/res/values/styles.xml
          if grep -q 'AppTheme.NoActionBarLaunch' "$S"; then
            sed -i 's#<style name="AppTheme.NoActionBarLaunch"[^>]*>#&\n        <item name="windowSplashScreenBackground">\#090d18</item>\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_round</item>#' "$S"
          fi
          cat "$S"

      - name: Izin getar
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          grep -n 'VIBRATE' "$M"

      - name: Nomor versi
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Kunci penanda tetap (agar bisa diperbarui tanpa hapus aplikasi)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi

      - run: npx cap sync android

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Siapkan berkas
        run: cp android/app/build/outputs/apk/debug/app-debug.apk edge-journal.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Edge Journal APK #${{ github.run_number }}
          files: edge-journal.apk
